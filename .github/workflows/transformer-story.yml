name: Transformer story verification
on:
  push:
    branches: [design/transformer-story-20261011, main]
    paths:
      - 'src/app/work/transformer/**'
      - 'scripts/*transformer*'
      - 'tests/transformer*'
      - 'playwright-transformer.config.ts'
      - 'playwright-preserved.config.ts'
      - '.github/workflows/transformer-story.yml'
  workflow_dispatch:
concurrency:
  group: transformer-story-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Verify pinned model data and approved writing
        run: |
          python3 scripts/prepare-transformer.py
          git diff --exit-code -- src/app/work/transformer tests/fixtures/transformer-original-copy.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint and production build
        run: npm run lint && npm run build
      - name: Install browser test runtimes
        run: npx playwright install --with-deps chromium webkit
      - name: Transformer browser and numerical checks
        run: |
          npx playwright test -c playwright-transformer.config.ts
          cp qa/transformer-results.json qa/local-transformer-results.json
      - name: Della, VialGrade and writing-note regression checks
        run: |
          npx playwright test -c playwright-preserved.config.ts
          cp qa/preserved-results.json qa/local-preserved-results.json
      - name: Check the live route after production deployment
        if: github.ref_name == 'main'
        run: |
          node - <<'JS'
          (async()=>{ for(let i=0;i<30;i++){const r=await fetch('https://nate-pegg-portfolio.vercel.app/work/transformer');const t=await r.text();if(t.includes('data-testid="transformer-lab"'))process.exit(0);await new Promise(r=>setTimeout(r,5000));}process.exit(1);})()
          JS
          TRANSFORMER_TEST_URL=https://nate-pegg-portfolio.vercel.app npx playwright test -c playwright-transformer.config.ts
          TRANSFORMER_TEST_URL=https://nate-pegg-portfolio.vercel.app npx playwright test -c playwright-preserved.config.ts
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: transformer-story-qa
          path: |
            qa/
            test-results/
            src/app/work/transformer/
          retention-days: 7
